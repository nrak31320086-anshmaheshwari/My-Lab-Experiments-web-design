<body>
    <h1 align="center">Student Registration Form</h1>
    <fieldset>
        <form action="#">

    <lable for="name">Full Name:</lable>
<input type="text" name="name" id="name"
placeholder="Enter your full name" required>
<br><br>

<label for="Email">Email:</label>
<input type="email" name="email" id="email"
placeholder="Enter your email address">
<br><br>
<lable for="pass">Password:</lable>
<input type="password" name="pass" id="pass"
placeholder="Enter Your Password">
<br><br>

<label for="gender">Gender:</label>
<input type="radio"name="gender"
id="gender"><label for="gender">Male</label>
<input type="radio"name="gender"
id="gender"><label for="gender">Female</label>
<input type="radio" name="gender"
id="gender"><label for="gender">Other</label>
<br><br>

<label for="Course:">Course:</label>
<select name="Select Course" id="Select Course">

<option value=" "> -Select Course-</option>
<option value="Btech">Btech</option>
<option value="B-Pharma">B-Pharma</option>
<option value="BBA">BBA</option>
<option value="BCA">BCA</option>
        </select>


<br><br>
<label for="tel">Contract No:</label>
<input type="tel" name="tel" id="tel"
placeholder="Enter phone number">

<br><br>
   <label for="add">Address:</label>
   <br>
<textarea  name="add" id="add" rows="04" cols="40"
placeholder="Enter your address"></textarea>
 

<br><br>

<input type="Submit" value="Register">
<input type="Reset" value="Clear">

<br><br>
        </form>
    </fieldset>
